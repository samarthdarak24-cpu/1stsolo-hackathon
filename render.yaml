services:
  - type: web
    name: lostlink-backend
    env: node
    rootDir: mern/backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: samarthdb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://onestsolo-hackathon-1frontend.onrender.com
      - key: AI_SERVICE_URL
        value: https://onestsolo-hackathon-ai-service.onrender.com
      - key: AI_ENABLED
        value: true
      - key: DATA_MODE
        value: postgres
      - key: MAIL_DRIVER
        value: off

  - type: web
    name: lostlink-ai
    env: python
    rootDir: mern/ai-service
    plan: free
    buildCommand: pip install -r requirements-core.txt -r requirements-ml.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8100
    envVars:
      - key: VLM_BASE_URL
        sync: false

  - type: static
    name: lostlink-frontend
    rootDir: mern/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://onestsolo-hackathon.onrender.com
